api:
  listen: ":1984"

rtsp:
  listen: ":8554"

streams:
  # Xiongmai / XMeye recorder (NetSurveillance, "Sofia" DVRIP protocol).
  #
  # This device exposes NO RTSP at all — a full port scan found only 80 (ActiveX
  # web UI), 34567 (DVRIP), 30100 and 44884. Port 554 is closed, so the Dahua
  # style rtsp://.../cam/realmonitor URL this config used to carry could never
  # have worked here; it belonged to a different device.
  #
  # go2rtc speaks DVRIP natively, so it talks to the recorder directly and
  # republishes the stream as RTSP for the worker.
  #
  # channel is ZERO-BASED here: the old Dahua URL said channel=16, which is the
  # 16th channel counting from one, i.e. index 15 below.
  # subtype: 0 = main stream, 1 = substream (smaller, use it if the CPU struggles).
  cam01_main:
    - "dvrip://danil:danil_2004@192.168.0.225:34567?channel=15&subtype=0"

  # Handy while finding the right channel — point the worker at one of these,
  # or just open http://<host>:1984 and watch them side by side.
  # cam01_ch0:
  #   - "dvrip://danil:danil_2004@192.168.0.225:34567?channel=0&subtype=0"
  # cam01_ch1:
  #   - "dvrip://danil:danil_2004@192.168.0.225:34567?channel=1&subtype=0"

  # Same camera, transcoded to MJPEG by ffmpeg.
  #
  # Every MJPEG frame is a keyframe, so /api/frame.jpeg against this source has
  # nothing to wait for — the ~470 ms keyframe wait measured on cam01_main goes
  # away, and the H.264 decode happens once in a running pipeline instead of once
  # per HTTP request.
  #
  # Costs a continuous ffmpeg process. Try it before committing to it:
  #   npm run measure:camera        (after pointing WORKER_CAMERA_SOURCES here)
  # and watch CPU with `top` — this box has 4 cores and the detector needs them.
  #
  # -q:v sets JPEG quality (2 = best, 31 = worst). go2rtc's own mjpeg template
  # sets none, and ffmpeg then falls back to bitrate control tuned for tiny
  # frames: a 2560x1440 frame came out at ~57 KB, i.e. heavy block artifacts,
  # and a face 60-100 px across became a smear. The same pixels feed the
  # detector, the embeddings, the emotion model and the saved snapshots, so
  # this one flag is the input-quality lever for all four. Expect ~400-700 KB
  # per frame at q3 (npm run measure:camera -- --stream cam01_mjpeg shows it).
  #
  # -r caps the transcode to 12 fps: the worker only ever takes the newest
  # frame and a pass takes longer than 1/12 s, so frames above that are pure
  # encode/parse cost.
  cam01_mjpeg:
    - "ffmpeg:cam01_main#video=mjpeg#raw=-q:v 3 -r 12"
