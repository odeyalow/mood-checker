notes:
  - "face-api and @tensorflow/tfjs-node are loaded lazily via loadFaceApi() and are OPTIONAL: tfjs-node is a native addon that needs a per-platform build. With backend=insightface plus HSEmotion nothing on the working path uses them, so a machine without that build runs the full pipeline — the worker logs \"continuing without face-api\" and sets faceApiReady=false. Only WORKER_INFERENCE_BACKEND=faceapi makes a failed load fatal."
  - "Motion scoring uses downsampleRgbToLuma (plain JS box sample to 96x54), not tfjs. The old path built an int32 tensor of the whole frame (~25 MB at 1920x1080) every loop purely to resize it."
  - "Detection worker is one ~180 KB .mjs file — grep by WORKER_* env name or function name rather than reading it whole."
  - ".env.worker.example is the source of truth for worker tuning; three profile presets live in scripts/apply-worker-profile-*.mjs."
  - "playwright is declared in dependencies but not imported anywhere in src/, worker/ or scripts/."
  - "go2rtc.yaml contains plaintext RTSP credentials and is committed."
  - "middleware.ts MUST live at src/middleware.ts, not the repo root: this project keeps its app under src/, and Next silently ignores a root middleware in that layout — every protected page was publicly reachable until it was moved."
  - "EmotionSnapshot is written by nothing. The emotion chart is computed on the fly from Recognition rows in /api/emotion-dynamics; only the extra latestSnapshot field reads that table, and the dashboard does not render it. Treat the model as unused rather than broken."
  - "Risk zones are derived, not stored: computeRiskStats in src/lib/stats.ts flags an identity when negative >= 40% or risk >= 50%, and dashboard-stats counts the flagged identities. It reads Recognition.mood through classifyMood, so paired labels are handled."
  - "No automated tests exist; verification is manual via the dashboard and worker logs."
  - "Camera range is tuned in .env.worker, not in code: the committed defaults are still the old 2-4 m preset. Current camera is 1-3 m at 1920x1080 (GO2RTC_FRAME_WIDTH). Face size drives everything — head 16 cm at 1920px/90deg is ~154px at 1 m, ~51px at 3 m."
  - "Size-gate trap: WORKER_FILTER_MIN_SIDE_PX is checked against both box sides (width binds), while WORKER_MATCH_MIN_FACE_SIDE_PX and WORKER_PERSON_MIN_SIDE_PX compare against max(width,height) (height, ~1.3x the width). Mixing the two units silently widens the recorded range."
  - "WORKER_MATCH_MIN_FACE_SIDE_PX is the main defence against one person collecting many IDs: ArcFace embeddings from small crops are unstable. Calibrate it with WORKER_POSE_DEBUG=1 and the logged side= value."
  - "Measured on this CPU: SCRFD detection dominates the loop (269 ms at det_size 960, 145 ms at 640, 81 ms at 416); ArcFace embedding is nearly free (+0) and HSEmotion adds ~25 ms/face. Lower det_size first when chasing latency."
  - "parseEmotionFromExpressions was written to compensate for face-api's expression net over-predicting neutral: it discounts neutral, boosts expressive classes 1.16-1.34x and promotes a runner-up over neutral. That miscalibrates HSEmotion — a real face scored Neutral 0.58 came out as angry at strictness 0.5. Use WORKER_EMOTION_STRICTNESS=1 with HSEmotion."
  - "A near-tie between two compatible emotions is written as a paired mood, e.g. \"sad+neutral\" (buildPairedEmotionLabel in the worker). Two conditions: the top two within WORKER_EMOTION_PAIR_MAX_GAP of each other AND the second leading the third by WORKER_EMOTION_PAIR_MIN_LEAD, so the pair has to stand out rather than just be adjacent in a flat read. EMOTION_NEIGHBOURS restricts pairs to emotions that can share a face. classifyMood() in src/lib/mood.ts splits on \"+\" and classifies by the DOMINANT half, so dashboard positive/neutral/negative counts stay meaningful."
  - "session.emotionSamples stores the FULL per-frame distribution, not just the winning label. Averaging distributions resists a single misread frame and keeps near-ties intact; tallying argmax winners (WORKER_EMOTION_VOTE_WEIGHT > 0) also resists noise but collapses ties, which silently disables paired labels."
  - "Emotion accuracy has three independent layers, debug them in this order: (1) the model's raw output — check with scripts/calibrate-emotion.mjs; (2) per-person bias, WORKER_EMOTION_CLASS_BIAS, applied in the service right after the 8->7 fold; (3) temporal aggregation in the worker. A face read wrong on EVERY frame is layer 1/2 and smoothing will never fix it; a label that flickers is layer 3."
  - "Emotion samples live in session.emotionSamples, a rolling time window (WORKER_EMOTION_WINDOW_MS, 2500 ms), pruned on every add and resolve. Never clear it on emit: that leaves the next frame as the only sample (share 1.0) and a single misread frame writes a wrong row straight after a correct one."
  - "Emotion label stability lives in resolveSessionEmotionLabel: labels are ranked by the SHARE of frames they won (WORKER_EMOTION_VOTE_WEIGHT), not by their best frame (WORKER_EMOTION_PEAK_WEIGHT=0). The old avg*0.75+peak*0.25 let a single misread frame decide a whole visit. The per-class EMA is also symmetric now — non-neutral classes used to get alpha +0.16, passing expressive spikes through unsmoothed."
  - "Switching HSEmotion variants does not help accuracy: measured on real frames, enet_b2_8 was clearly worse (3 of 7 frames read as disgusted) and enet_b0_8_best_vgaf was no better than the default enet_b0_8_best_afew. Fix aggregation, not the model. Note b2 needs 260x260 input, not 224."
  - "Measured time-to-first-record with a steady frame source: median 0.71 s, spread 0.35 s (min 0.67, max 1.02) at det_size 640."
  - "One presence session normally emits ONE Recognition row per visit (session.emittedAt). WORKER_EMOTION_CHANGE_RECORD lets it emit again when the mood changes mid-visit; the emit resets session.emotionStats so the next label reflects fresh frames."
  - "Emotion labels: the service speaks HSEmotion's 8 AffectNet classes internally but returns face-api's 7 keys (neutral/happy/sad/angry/fearful/disgusted/surprised). Contempt is folded into disgusted. Keep that mapping if you swap the emotion model."
  - "insightface is pinned to 0.7.3 (sdist, needs MSVC on Windows/Py3.12). insightface 2.0 is a pure-Python wheel and is API-compatible with what the service uses — prefer it for local dev."
  - "prisma/dev.db is TRACKED in git despite being gitignored — untracking it will delete the file on the next `git pull` wherever it is checked out, including production. Back up the server DB before touching this."
  - "Face identities carry a descriptor TEMPLATE: FaceIdentity.descriptors is an array of up to FACE_TEMPLATE_MAX (8) distinct vectors, matched by closest member (templateDistance). FaceIdentity.descriptor stays as the EMA-updated primary and is the fallback for rows predating the column. Worker computeMatchCandidates already scored min-over-list, so it needed no change."
  - "Templates only grow from ACCEPTED matches, so they cannot bridge a pose that was already too far to match — that is the bootstrap limit. Track-based enrollment (seeding the template from one continuous presence session) is the next step if duplicates persist."
  - "Migration order is inconsistent: 20260203063848 ALTERs EmotionSnapshot, but the CREATE for that table lives in the later 20260203113000. `prisma migrate deploy` on an empty DB fails at the first of the two."
